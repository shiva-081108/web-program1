    <script>
//draw a dices and find the lucky number
//dice -from 1 to 6
let lucky =Math.floor( Math.random() * 6)+1
//console.log(lucky)
while(true){

    //winning condition
    guess = prompt("enter your number between 1 to 6")
    if(lucky=guess){
        alert("you won the game")
        break;

    }else{
        alert("better luck next time")
    }
}







    </script>
